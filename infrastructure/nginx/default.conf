map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

# Omit query strings and referrers. Verification and invitation links carry tokens.
log_format nexusflow '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';

server {
  listen 80;
  server_tokens off;
  client_max_body_size 6m;
  access_log /var/log/nginx/access.log nexusflow;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  add_header Referrer-Policy same-origin always;
  add_header Strict-Transport-Security $nexus_hsts always;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;

  # Apply the same ingress identity rules to Next rewrites and direct API routes.
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-NexusFlow-Client-IP $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $nexus_scheme;
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-Port "";
  proxy_set_header Forwarded "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location / { proxy_pass http://web:3000; }
  location /api/ { proxy_pass http://gateway:8080; }
  location = /socket.io {
    proxy_read_timeout 75s;
    proxy_pass http://gateway:8080/socket.io/;
  }
  location /socket.io/ {
    proxy_read_timeout 75s;
    proxy_pass http://gateway:8080;
  }
  location /swagger-ui { proxy_pass http://gateway:8080; }
  location /v3/api-docs { proxy_pass http://gateway:8080; }
  location /actuator/ { return 404; }
  location /internal/ { return 404; }
  location = /health { proxy_pass http://gateway:8080/actuator/health/readiness; }
}
