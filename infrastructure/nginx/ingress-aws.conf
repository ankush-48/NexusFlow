# These two subnets host the TLS-only ALB. Its security group is the sole
# permitted source for port 3000. Keep these in sync with aws_subnet.edge.
set_real_ip_from 10.48.0.0/24;
set_real_ip_from 10.48.1.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
map $scheme $nexus_scheme { default https; }
map $scheme $nexus_hsts { default "max-age=31536000"; }
