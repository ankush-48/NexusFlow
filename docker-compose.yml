name: nexusflow

services:
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_USER: nexusflow_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD in .env}
      REALTIME_DB_PASSWORD: ${REALTIME_DB_PASSWORD:?Set REALTIME_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nexusflow_admin -d nexusflow -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: [redis-server, "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 8s
      timeout: 7s
      retries: 20

  kafka-init:
    image: apache/kafka:4.1.1@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for topic in nexusflow.domain.v1 nexusflow.domain.dlq.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done

  object-store:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    command: [mini, "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: nexusflow
    volumes: [seaweed-data:/data]

  mail:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ["127.0.0.1:8025:8025"]

  core:
    build: ./services/core-api
    environment:
      CORE_DB_URL: jdbc:postgresql://postgres:5432/nexusflow
      CORE_DB_USER: nexusflow_core
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      KAFKA_BROKERS: kafka:9092
      NEXUS_ORIGIN: ${NEXUS_ORIGIN:-http://localhost:3000}
      NEXUS_SECURE_COOKIES: ${NEXUS_SECURE_COOKIES:-false}
      NEXUS_VERIFY_EMAIL: ${NEXUS_VERIFY_EMAIL:-true}
      NEXUS_DEMO_PASSWORD: ${NEXUS_DEMO_PASSWORD:-}
      NEXUS_WORKER_SECRET: ${NEXUS_WORKER_SECRET:?Set NEXUS_WORKER_SECRET in .env}
      NEXUS_BILLING_MODE: ${NEXUS_BILLING_MODE:-mock}
      SMTP_HOST: mail
      NEXUS_S3_BUCKET: nexusflow
      NEXUS_S3_ENDPOINT: http://object-store:8333
      NEXUS_S3_CREATE_BUCKET: "true"
      NEXUS_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      NEXUS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE: ${STRIPE_PRO_PRICE:-}
      STRIPE_ENTERPRISE_PRICE: ${STRIPE_ENTERPRISE_PRICE:-}
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8081/actuator/health/readiness"]
      interval: 6s
      timeout: 4s
      retries: 30

  realtime:
    build:
      context: .
      dockerfile: services/realtime-service/Dockerfile
    environment:
      REALTIME_DB_URL: postgresql://nexusflow_realtime:${REALTIME_DB_PASSWORD}@postgres:5432/nexusflow_realtime
      CORE_URL: http://core:8081
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      NEXUS_ORIGIN: ${NEXUS_ORIGIN:-http://localhost:3000}
      NEXUS_SEED_COLLAB: ${NEXUS_SEED_COLLAB:-false}
      NEXUS_WORKER_SECRET: ${NEXUS_WORKER_SECRET}
    depends_on:
      core: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 6s
      timeout: 4s
      retries: 20

  gateway:
    networks: [ingress, default]
    build: ./services/api-gateway
    environment:
      CORE_URL: http://core:8081
      REALTIME_URL: http://realtime:4000
      NEXUS_TRUST_INGRESS_IP: "true"
      REDIS_URL: redis://redis:6379
      NEXUS_ORIGIN: ${NEXUS_ORIGIN:-http://localhost:3000}
    depends_on:
      core: {condition: service_healthy}
      realtime: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness"]
      interval: 6s
      timeout: 4s
      retries: 20

  web:
    networks: [ingress]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 6s
      timeout: 4s
      retries: 20

  nginx:
    networks: [ingress]
    image: nginx:1.30-alpine@sha256:8eb2b5540eae779603cc3db84b3986a15ecb5308b54303146eee9837c137b51a
    ports: ["127.0.0.1:${NEXUS_PORT:-3000}:80"]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/ingress-local.conf:/etc/nginx/conf.d/00-ingress.conf:ro
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 6s
      timeout: 4s
      retries: 20
    depends_on:
      web: {condition: service_healthy, restart: true}
      gateway: {condition: service_healthy, restart: true}

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: [observability]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3010:3000"]
    depends_on: [prometheus]

networks:
  ingress:
  default:

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  seaweed-data:
  prometheus-data:
  grafana-data:
