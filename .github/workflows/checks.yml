name: Checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace @nexusflow/web
      - run: npm run check
      - run: npm run test --workspaces
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e --workspace @nexusflow/web

  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core-api, api-gateway]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -f services/${{ matrix.service }}/pom.xml verify
      - name: Check Java runtime dependencies against OSV
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mvn --batch-mode --no-transfer-progress -f "services/$SERVICE/pom.xml" org.apache.maven.plugins:maven-dependency-plugin:3.7.0:tree -Dscope=runtime -DoutputType=json "-DoutputFile=$RUNNER_TEMP/runtime-deps.json"
          node scripts/audit-java.mjs "$RUNNER_TEMP/runtime-deps.json"

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.12.2
      - run: terraform -chdir=infrastructure/terraform fmt -check
      - run: terraform -chdir=infrastructure/terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=infrastructure/terraform validate
      - name: Install the pinned configuration scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Scan the restricted staging profile
        run: trivy config --tf-vars infrastructure/terraform/validation.tfvars --severity HIGH,CRITICAL --exit-code 1 infrastructure/terraform

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/init-env.mjs --demo
      - run: docker compose config --quiet
      - name: Exercise local and ALB ingress rules
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          NGINX_BINARY=/usr/sbin/nginx node tests/deployment/ingress.test.mjs
      - name: Validate managed deployment profile
        run: docker compose -f docker-compose.yml -f docker-compose.aws.yml config --format json | node scripts/check-aws-config.mjs
        env:
          NEXUS_ORIGIN: https://nexus.example.test
          NEXUS_RELEASE_TAG: ${{ github.sha }}
          RDS_ENDPOINT: rds.example.test
          NEXUS_S3_BUCKET: ci-nexusflow-objects
          SMTP_HOST: smtp.example.test
          SMTP_USERNAME: ci
          SMTP_PASSWORD: config-validation-only
          SMTP_FROM: ci@example.test
      - name: Build and run services
        run: docker compose up --build --wait
        env:
          NEXUS_VERIFY_EMAIL: "false"
          NEXUS_ORIGIN: http://127.0.0.1:3000
      - run: node scripts/smoke-ingress.mjs http://127.0.0.1:3000
      - name: Verify session expiry and concurrent credential changes on PostgreSQL
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          pg_container=$(docker compose ps -q postgres)
          pg_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' "$pg_container" | head -n 1)
          export NEXUS_TEST_CORE_JDBC="jdbc:postgresql://$pg_ip:5432/nexusflow"
          export NEXUS_TEST_CORE_DB_USER=nexusflow_core
          NEXUS_TEST_CORE_DB_PASSWORD=$(docker compose exec -T postgres printenv CORE_DB_PASSWORD)
          export NEXUS_TEST_CORE_DB_PASSWORD
          mvn -B --no-transfer-progress -f services/core-api/pom.xml -Dtest=SessionLifecyclePostgresTest test
      - run: npm run test:integration
        env:
          NEXUS_TEST_WORKFLOWS: "1"
          NEXUS_TEST_ATTACHMENTS: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e --workspace @nexusflow/web
        env:
          NEXUS_LIVE_E2E: "1"
          NEXUS_E2E_URL: http://127.0.0.1:3000
      - name: Check monitoring
        shell: bash
        run: |
          docker compose --profile observability up -d grafana prometheus
          for attempt in {1..30}; do
            if curl -fs --max-time 2 http://127.0.0.1:3010/api/health | jq -e '.database == "ok"' >/dev/null &&
               curl -fs --max-time 2 http://127.0.0.1:9090/api/v1/targets | jq -e '[.data.activeTargets[] | select(.health == "up") | .labels.job] | contains(["core","gateway"])' >/dev/null; then
              echo "Grafana is healthy and Prometheus is scraping both Java services."
              exit 0
            fi
            sleep 3
          done
          curl -sS --max-time 3 http://127.0.0.1:3010/api/health || true
          curl -sS --max-time 3 http://127.0.0.1:9090/api/v1/targets || true
          exit 1
      - name: Rehearse sustained traffic and worker recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          NEXUS_TEST_URL: http://127.0.0.1:3000
          NEXUS_DISPOSABLE: "1"
          NEXUS_PLATEAU_SECONDS: "720"
        run: |
          node tests/load/mixed.mjs
          node tests/load/worker-recovery.mjs --compose
          node tests/load/broker-recovery.mjs --compose
          node tests/load/rate-limit-recovery.mjs --compose
      - name: Install the pinned image scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Scan each built application image
        run: |
          result=0
          for service in core realtime gateway web; do
            image_id=$(docker compose images -q "$service")
            trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image_id" || result=1
          done
          exit "$result"
      - if: failure()
        run: |
          docker compose --profile observability ps -a
          docker compose logs --no-color --tail=120 kafka kafka-init postgres core realtime gateway web nginx
          docker compose --profile observability logs --no-color --tail=80 grafana prometheus
      - if: always()
        run: docker compose --profile observability down -v
